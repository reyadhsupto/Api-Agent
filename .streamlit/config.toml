# .streamlit/config.toml

# The app uses a single light theme. The token layer in
# frontend/styles/tokens.py repeats these values for custom app surfaces.
[theme]
base = "light"
primaryColor = "#ff6c37"
backgroundColor = "#f6f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#12161d"
font = "sans serif"

[browser]
gatherUsageStats = false
